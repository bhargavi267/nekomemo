<style>

round:#ffffffc9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);gap:15px;position:sticky;top:0;z-index:4}.search{width:min(430px,52vw);position:relative}.search input{width:100%;border:1px solid var(--line);background:#fafaff;border-radius:13px;padding:11px 14px 11px 40px}.search span{position:absolute;left:14px;top:10px;color:#aaa6bf}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:13px;background:#ffe8d7;display:grid;place-items:center;font-size:20px}.content{max-width:1240px;margin:auto;padding:clamp(20px,4vw,44px)}.welcome{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--primary);font-size:12px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800}.welcome h1{font-size:clamp(27px,3vw,37px);letter-spacing:-1.2px;margin:5px 0 7px;line-height:1.15}.welcome p{margin:0;color:var(--muted)}.hero-cat{font-size:52px;background:linear-gradient(140deg,#efedff,#fceeff);border-radius:28px;width:112px;height:112px;display:grid;place-items:center;flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:28px}.stat,.panel,.subject,.topic-card{background:var(--panel);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;gap:8px}.stat-icon{width:33px;height:33px;border-radius:11px;background:var(--soft);display:grid;place-items:center;font-size:16px}.stat strong{display:block;font-size:28px;letter-spacing:-.7px;margin-top:12px}.stat small{color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:27px 0 14px}.section-head h2{font-size:19px;margin:0;letter-spacing:-.3px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}.subject-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.subject{padding:18px;text-align:left;transition:.2s;cursor:pointer}.subject:hover,.topic-card:hover{transform:translateY(-3px);border-color:#d7d1ff}.subject .sicon{height:44px;width:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--soft);margin-bottom:15px}.subject b{display:block;font-size:14px}.subject small{display:block;color:var(--muted);margin-top:4px}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:24px}.panel{padding:21px;min-width:0}.panel h3{margin:0;font-size:16px}.panel .sub{color:var(--muted);font-size:12px;margin-top:4px}.topic-list{display:grid;gap:10px;margin-top:16px}.topic-row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px}.topic-emoji{width:39px;height:39px;border-radius:12px;background:#f1efff;display:grid;place-items:center;font-size:19px;flex-shrink:0}.topic-row .row-main{flex:1;min-width:0}.topic-row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topic-row small{color:var(--muted)}.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:13px}.due-card{background:linear-gradient(140deg,#6d5ce8,#8978f7);border-radius:18px;padding:20px;color:#fff;margin-top:16px}.due-card p{color:#efedff;font-size:13px;margin:5px 0 16px}.due-card button{background:#fff;color:var(--primary)}.page-title{margin-bottom:22px}.page-title h1{margin:0 0 5px;font-size:29px;letter-spacing:-.7px}.page-title p{margin:0;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:12px;color:#5c5974}.field input,.field textarea,.field select{width:100%;border:1px solid #dfddec;background:#fff;border-radius:11px;padding:11px 12px;color:var(--text)}.field textarea{min-height:105px;resize:vertical}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{background:#f1efff;border:1px solid #e1dcff;border-radius:13px;padding:13px 15px;color:#5b4bd0;font-size:13px;margin-bottom:18px}.explain-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.explanation h2{margin:0 0 10px}.explanation h3{margin:23px 0 6px;font-size:16px}.explanation p,.explanation li{color:#5f5c76}.keypoint{padding:12px 14px;background:#f7f6ff;border-radius:11px;margin:8px 0;color:#5144bd}.studycard{background:linear-gradient(145deg,#fff,#f8f6ff);border:1px solid #e5e0ff;border-radius:23px;padding:32px;text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}.studycard .type{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--primary);font-weight:800}.studycard .question{font-size:clamp(22px,3vw,30px);font-weight:750;letter-spacing:-.6px;margin:22px 0;overflow-wrap:anywhere}.studycard .answer{font-size:17px;color:#5b5872;white-space:pre-wrap;overflow-wrap:anywhere}.study-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:17px}.progress{height:6px;background:#ebe9f7;border-radius:9px;overflow:hidden;margin:15px 0}.progress span{height:100%;display:block;background:var(--primary);width:0;transition:.2s}.cards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini-card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.mini-card b{display:block;margin-bottom:7px;overflow-wrap:anywhere}.mini-card p{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.mini-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#f0eefb;color:#6b5cdb;font-size:11px;font-weight:700}.quiz-question{padding:20px;border:1px solid var(--line);border-radius:16px;margin-top:14px}.quiz-question h3{font-size:16px}.option{display:block;width:100%;text-align:left;margin:8px 0;background:#f8f7fc;color:var(--text);border:1px solid var(--line)}.option.selected{border-color:var(--primary);background:var(--soft);color:var(--primary)}.option.correct{border-color:#7bd7bd;background:#e8fbf4}.option.wrong{border-color:#f1a0a8;background:#fff0f1}.feedback{font-size:13px;margin-top:9px;color:var(--muted)}.library-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.library-tools input,.library-tools select{border:1px solid var(--line);border-radius:11px;padding:10px;background:white}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#29263f;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.mobile-menu{display:none}.footer-note{font-size:11px;color:#9995ae;margin-top:25px;text-align:center}
@media(max-width:1000px){.subject-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.explain-layout{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:245px;z-index:10;transition:.2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{height:66px;padding:0 15px}.search{width:100%}.top-actions .desktop-only{display:none}.content{padding:22px 16px 35px}.welcome{align-items:flex-start}.hero-cat{width:68px;height:68px;font-size:34px;border-radius:20px}.welcome h1{font-size:27px}.stats{gap:10px}.stat{padding:13px}.stat strong{font-size:24px}.subject-grid{gap:10px}.subject{padding:14px}.two-col{gap:13px}.panel{padding:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.cards-grid{grid-template-columns:1fr}.topic-row{align-items:flex-start}.topic-row .row-actions{display:grid}.studycard{padding:23px 16px;min-height:250px}.page-title h1{font-size:25px}.top-actions{gap:5px}}

<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="catlogo">🐱</div><div><strong>NekoMemo</strong><small>Learn smarter. Remember longer.</small></div></div>
  <div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
    <button data-page="learn"><span class="ico">✦</span>Learn a topic</button>
    <button data-page="flashcards"><span class="ico">▣</span>Flashcards</button>
    <button data-page="revision"><span class="ico">↻</span>Revision</button>
    <button data-page="quizzes"><span class="ico">☑</span>Quizzes</button>
    <button data-page="library"><span class="ico">▤</span>My library</button>
  </nav></div>
  <div class="side-bottom"><b>🐾 A little progress every day</b>Learn first. Recall next. Review regularly. Your learning is saved in this browser.</div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
      <button class="ghost mobile-menu" id="menuBtn" aria-label="Open menu">☰</button>
      <label class="search"><span>⌕</span><input id="globalSearch" placeholder="Search topics and flashcards..." aria-label="Search topics and flashcards"></label>
    </div>
    <div class="top-actions"><button class="secondary desktop-only" id="quickAdd">＋ Add flashcard</button><div class="avatar">🐱</div></div>
  </header>
  <div class="content" id="view"></div>
</main>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY='nekomemo_v1_data';
const icons={'Japanese':'あ','Programming':'</>','Cloud Computing':'☁','General Studies':'✦','Science':'⚗','Mathematics':'∑','Custom Learning':'✎'};
const defaultData={topics:[],cards:[],quizHistory:[],settings:{name:'Learner'}};
let data=loadData(),currentPage='dashboard',currentTopicId=null,studyCards=[],studyIndex=0,answerShown=false,quizState=null;
function loadData(){try{return {...defaultData,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));renderStats()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function today(){return new Date().toISOString().slice(0,10)}
function go(page){currentPage=page;document.getElementById('sidebar').classList.remove('open');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
function renderStats(){/* computed by render */}
function stat(label,value,icon,sub=''){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${sub}</small></div>`}
function topicEmoji(s){return icons[s]||'✦'}
function topicById(id){return data.topics.find(t=>t.id===id)}
function cardDue(c){return !c.nextReview||c.nextReview<=today()}
function pageTitle(title,sub,button=''){return `<div class="page-title"><h1>${title}</h1><p>${sub}</p>${button?`<div style="margin-top:15px">${button}</div>`:''}</div>`}
function render(){const v=document.getElementById('view');if(currentPage==='dashboard')v.innerHTML=dashboard();else if(currentPage==='learn')v.innerHTML=learnPage();else if(currentPage==='topic')v.innerHTML=topicPage();else if(currentPage==='flashcards')v.innerHTML=flashcardsPage();else if(currentPage==='study')v.innerHTML=studyPage();else if(currentPage==='revision')v.innerHTML=revisionPage();else if(currentPage==='quizzes')v.innerHTML=quizzesPage();else if(currentPage==='library')v.innerHTML=libraryPage();else v.innerHTML=dashboard();attachPageEvents()}
function dashboard(){let due=data.cards.filter(cardDue).length,learned=data.topics.length,streak=Number(localStorage.getItem('nekomemo_streak')||0),avg=data.quizHistory.length?Math.round(data.quizHistory.reduce((a,q)=>a+q.score,0)/data.quizHistory.length):0;return `
<div class="welcome"><div><div class="eyebrow">YOUR PERSONAL LEARNING SPACE</div><h1>What would you like to learn today?</h1><p>Small steps become big knowledge. Let's make today count.</p><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="primary" data-go="learn">＋ Create learning topic</button><button class="secondary" data-go="flashcards">Study flashcards →</button></div></div><div class="hero-cat">🐱</div></div>
<div class="stats">${stat('Topics saved',learned,'📚','Your learning collection')}${stat('Total flashcards',data.cards.length,'🗂️','AI or self-created cards')}${stat('Due for revision',due,'🔄','Ready for a quick review')}${stat('Average quiz score',data.quizHistory.length?avg+'%':'—','🎯',data.quizHistory.length?'Across completed quizzes':'Take your first quiz')}</div>
<div class="section-head"><div><h2>Explore a subject</h2><p>Pick a starting point or enter anything you want to learn.</p></div><button class="ghost small" data-go="learn">All subjects ↗</button></div>
<div class="subject-grid">${[['Japanese','🇯🇵','Words, kanji & grammar'],['Programming','💻','Python and more'],['Cloud Computing','☁️','Cloud concepts & services'],['General Studies','🌎','Exam and general knowledge'],['Science','🔬','Understand how things work'],['Mathematics','➗','Practice concepts'],['Custom Learning','✏️','Any topic you choose']].map(([s,i,d])=>`<button class="subject" data-subject="${s}"><span class="sicon">${i}</span><b>${s}</b><small>${d}</small></button>`).join('')}</div>
<div class="two-col"><section class="panel"><h3>Continue learning</h3><div class="sub">Jump back into a saved topic.</div><div class="topic-list">${data.topics.length?data.topics.slice().reverse().slice(0,4).map(t=>`<div class="topic-row"><div class="topic-emoji">${topicEmoji(t.subject)}</div><div class="row-main"><b>${esc(t.title)}</b><small>${esc(t.subject)} · ${t.level||'Beginner'} · ${data.cards.filter(c=>c.topicId===t.id).length} cards</small></div><button class="ghost small" data-open-topic="${t.id}">Open</button></div>`).join(''):'<div class="empty">Your first topic is waiting here.<br>Choose a subject above to begin.</div>'}</div></section>
<section class="panel"><h3>Quick revision</h3><div class="sub">Keep the things you learn fresh.</div><div class="due-card"><div style="font-size:12px;opacity:.85">YOUR REVIEW QUEUE</div><div style="font-size:29px;font-weight:800;margin-top:5px">${due} <span style="font-size:14px;font-weight:500">cards due</span></div><p>Review a few cards now to strengthen your memory.</p><button data-go="revision">Start revision →</button></div><div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap"><button class="secondary" data-go="quizzes">Take a quiz</button><button class="ghost" data-go="library">Open library</button></div></section></div><div class="footer-note">NekoMemo saves your learning data in this browser. Export it from My Library to keep a backup.</div>`}
function learnPage(pref=''){return `${pageTitle('Learn a new topic','Choose your subject, set your level, and start with understanding—not memorization.')}<div class="notice">✨ <b>Learn first, memorize second.</b> NekoMemo creates a structured starter explanation locally. Connect an AI backend later for dynamic AI-generated lessons.</div><section class="panel"><form id="topicForm"><div class="form-grid">
<div class="field"><label for="subject">Subject</label><select id="subject" required>${['Japanese','Programming','Cloud Computing','General Studies','Science','Mathematics','Custom Learning'].map(s=>`<option ${pref===s?'selected':''}>${s}</option>`).join('')}</select></div>
<div class="field"><label for="title">Topic name</label><input id="title" placeholder="e.g. Japanese て-form or Python lists" required maxlength="120"></div>
<div class="field"><label for="level">Learning level</label><select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div>
<div class="field"><label for="purpose">Learning purpose</label><select id="purpose"><option>General learning</option><option>Exam preparation</option><option>Interview preparation</option><option>Practical application</option></select></div>
<div class="field"><label for="style">Explanation style</label><select id="style"><option>Detailed Learn</option><option>Quick Learn</option><option>Exam Preparation</option></select></div>
<div class="field"><label for="count">Flashcards to create</label><select id="count"><option value="5">5 cards</option><option value="10" selected>10 cards</option><option value="20">20 cards</option></select></div>
<div class="field full"><label for="context">What do you want to focus on? (optional)</label><textarea id="context" placeholder="Add a syllabus, a question, or what you already know…"></textarea></div>
</div><div class="form-actions"><button class="primary" type="submit">Create topic & learn →</button><button class="ghost" type="reset">Clear form</button></div></form></section><div class="section-head"><div><h2>Or start with a subject</h2><p>Choose one to prefill the form.</p></div></div><div class="subject-grid">${[['Japanese','🇯🇵'],['Programming','💻'],['Cloud Computing','☁️'],['General Studies','🌎']].map(([s,i])=>`<button class="subject" data-subject="${s}"><span class="sicon">${i}</span><b>${s}</b><small>Enter a topic to begin</small></button>`).join('')}</div>`}
function makeLesson(title,subject,level,context=''){let lower=title.toLowerCase(),intro=`${title} is a topic within ${subject}. This starter lesson gives you a framework for learning the concept. For exact rules, specifications, or exam facts, check a trusted source or connect an AI provider.`;let sections=[];
if(subject==='Japanese'){sections=[['What to understand',`Start by identifying what ${title} means, where it is used, and how it differs from similar words or grammar. Pay attention to writing, reading, pronunciation, and context.`],['Examples and practice',`Write one simple example using ${title}. Read it aloud, identify each part, and note the English meaning. Then make a second example with a different subject or situation.`],['Common mistakes',`Avoid memorizing a translation without context. Check readings, particles, verb forms, and politeness level. Revisit examples you find difficult.`]]}
else if(subject==='Programming'){sections=[['Core idea',`${title} is easiest to learn by understanding the problem it solves, the inputs it accepts, and the output it produces. Learn the basic syntax, then test small examples.`],['Try a small example',`# Example learning exercise\\n# 1. Create a small input\\n# 2. Apply ${title}\\n# 3. Print or inspect the result\\n\\n# Add a real code example here and run it in your environment.`],['Common mistakes',`Check spelling and capitalization, data types, edge cases, and error messages. Change one thing at a time and test your understanding with a tiny program.`]]}
else if(subject==='Cloud Computing'){sections=[['Core idea',`Understand the problem ${title} solves, where it sits in a cloud architecture, and how it relates to compute, storage, networking, identity, and security.`],['Practical example',`Think of a real application and trace how a user request moves through the system. Identify which service is responsible for each step and what happens if that service fails.`],['Common mistakes',`Do not learn service names alone. Compare use cases, pricing dimensions, security responsibilities, availability, and the trade-offs of each design.`]]}
else {sections=[['Core idea',`Begin with a precise definition of ${title}. Break it into smaller parts, explain how the parts connect, and identify why the concept matters.`],['Worked example',`Create a simple example of ${title}. Write down what you know, what you need to find, each step you take, and how you can verify the result.`],['Common mistakes',`Watch for confusing similar terms, skipping steps, relying on memorized wording without understanding, and not checking your answer against evidence.`]]}
return {intro,sections,points:[`Explain ${title} in your own words.`,`Remember the key terms and how they relate to one another.`,`Practice with an example, then test yourself without looking.`],context}}
function createTopic(e){e.preventDefault();let subject=document.getElementById('subject').value,title=document.getElementById('title').value.trim();if(!title)return;let topic={id:uid(),subject,title,level:document.getElementById('level').value,purpose:document.getElementById('purpose').value,style:document.getElementById('style').value,count:+document.getElementById('count').value,createdAt:new Date().toISOString(),lesson:makeLesson(title,subject,document.getElementById('level').value,document.getElementById('context').value.trim())};data.topics.push(topic);save();currentTopicId=topic.id;toast('Topic created. Start by reading the explanation.');go('topic')}
function topicPage(){let t=topicById(currentTopicId);if(!t)return learnPage();let cards=data.cards.filter(c=>c.topicId===t.id);return `${pageTitle(esc(t.title),`${esc(t.subject)} · ${esc(t.level)} · ${esc(t.purpose)}`,`<button class="ghost small" data-go="learn">＋ New topic</button>`)}<div class="notice">📘 This is a locally generated starter lesson, not verified AI output. Use the sections to structure your learning, and add trusted details as needed.</div><div class="explain-layout"><section class="panel explanation"><span class="pill">STEP 1 · UNDERSTAND</span><h2 style="margin-top:15px">Let's understand ${esc(t.title)}</h2><p>${esc(t.lesson.intro)}</p>${t.lesson.context?`<h3>Your notes / focus</h3><p>${esc(t.lesson.context)}</p>`:''}${t.lesson.sections.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}<h3>Important points</h3>${t.lesson.points.map(p=>`<div class="keypoint">✦ ${esc(p)} <button class="ghost small" style="float:right" data-point-card="${esc(p)}" data-tid="${t.id}">＋ Card</button></div>`).join('')}<h3>Quick summary</h3><p>Define the concept, explain why it matters, review an example, and then recall the main points without looking. Add your own reliable notes to make this lesson specific and accurate.</p><div class="form-actions"><button class="secondary" data-simple="${t.id}">Explain more simply</button><button class="ghost" data-add-card="${t.id}">＋ Add my flashcard</button><button class="primary" data-generate="${t.id}">Generate starter flashcards →</button></div></section><aside><section class="panel"><h3>Your learning path</h3><div class="sub">Move through each stage at your own pace.</div><div class="topic-list"><div class="topic-row"><div class="topic-emoji">📖</div><div class="row-main"><b>1. Understand</b><small>Read explanation and examples</small></div><span>✓</span></div><div class="topic-row"><div class="topic-emoji">🗂️</div><div class="row-main"><b>2. Recall</b><small>${cards.length} flashcards saved</small></div></div><div class="topic-row"><div class="topic-emoji">🎯</div><div class="row-main"><b>3. Test yourself</b><small>Take a quick quiz</small></div></div></div><div class="due-card"><b>Ready to practice?</b><p>Make cards from the main points, then test what you remember.</p><button data-study-topic="${t.id}">Study this topic →</button></div></section></aside></div>`}
function createCardForm(prefTopic=''){let t=topicById(prefTopic);return `<div class="modal-backdrop" id="modalBackdrop" style="position:fixed;inset:0;background:#211d3a77;z-index:15;display:grid;place-items:center;padding:16px"><section class="panel" style="width:min(600px,100%);max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">＋ Add your flashcard</h2><p class="sub">Save something you want to remember.</p></div><button class="ghost" id="closeModal">✕</button></div><form id="cardForm" style="margin-top:18px"><div class="form-grid"><div class="field"><label>Subject</label><select id="cSubject">${['Japanese','Programming','Cloud Computing','General Studies','Science','Mathematics','Custom Learning'].map(s=>`<option ${t&&t.subject===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Topic / collection</label><select id="cTopic"><option value="">General collection</option>${data.topics.map(x=>`<option value="${x.id}" ${t&&t.id===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="field full"><label>Question, word, or term *</label><textarea id="cQuestion" required placeholder="What do you want to remember?"></textarea></div><div class="field full"><label>Answer, meaning, or definition *</label><textarea id="cAnswer" required placeholder="Write the answer in your own words…"></textarea></div><div class="field"><label>Reading / pronunciation (optional)</label><input id="cReading" placeholder="e.g. たべる · taberu"></div><div class="field"><label>Difficulty</label><select id="cDifficulty"><option>Normal</option><option>Easy</option><option>Difficult</option></select></div><div class="field full"><label>Example or notes (optional)</label><textarea id="cNotes" placeholder="Example sentence, code, or extra notes…"></textarea></div><div class="field full"><label><input type="checkbox" id="cImportant" style="width:auto"> Mark as Must Remember</label></div></div><div class="form-actions"><button class="primary" type="submit">Save flashcard</button><button class="ghost" type="button" id="cancelModal">Cancel</button></div></form></section></div>`}
function openCardModal(topicId=''){document.body.insertAdjacentHTML('beforeend',createCardForm(topicId));document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('cardForm').onsubmit=e=>{e.preventDefault();let card={id:uid(),subject:document.getElementById('cSubject').value,topicId:document.getElementById('cTopic').value,question:document.getElementById('cQuestion').value.trim(),answer:document.getElementById('cAnswer').value.trim(),reading:document.getElementById('cReading').value.trim(),difficulty:document.getElementById('cDifficulty').value,notes:document.getElementById('cNotes').value.trim(),important:document.getElementById('cImportant').checked,source:'User created',createdAt:new Date().toISOString(),reviews:0,nextReview:today()};if(!card.question||!card.answer)return;data.cards.push(card);save();closeModal();render();toast('Flashcard saved to your library!')}}
function closeModal(){document.getElementById('modalBackdrop')?.remove()}
function genCards(id){let t=topicById(id);if(!t)return;let points=t.lesson.points;let seed=[{q:`What is the main idea of ${t.title}?`,a:t.lesson.intro},{q:`What is one useful way to learn ${t.title}?`,a:t.lesson.sections[0][1]},{q:`Name one common mistake when learning ${t.title}.`,a:t.lesson.sections[t.lesson.sections.length-1][1]},...points.map((p,i)=>({q:`Key point ${i+1} about ${t.title}`,a:p}))];let existing=new Set(data.cards.filter(c=>c.topicId===id).map(c=>c.question));seed.slice(0,t.count).forEach((x,i)=>{if(existing.has(x.q))return;data.cards.push({id:uid(),subject:t.subject,topicId:id,question:x.q,answer:x.a,notes:'Starter card based on the lesson framework. Verify topic-specific facts.',difficulty:'Normal',important:i===0,source:'Starter generated',createdAt:new Date().toISOString(),reviews:0,nextReview:today()})});save();toast('Starter flashcards added. You can edit them anytime.');go('flashcards')}
function flashcardsPage(){let cards=data.cards;return `${pageTitle('Flashcards','Practice active recall or add your own cards at any time.',`<button class="primary" id="addFromPage">＋ Add flashcard</button> <button class="secondary" data-go="study">Start studying →</button>`)}<div class="notice">Cards marked “Starter generated” are template-based, not AI-verified. Edit them to add accurate subject-specific answers.</div>${cards.length?`<div class="section-head"><div><h2>All flashcards <span class="pill">${cards.length}</span></h2><p>AI/starter and user-created cards stay together, clearly labeled.</p></div><button class="ghost small" data-go="library">Manage library</button></div><div class="cards-grid">${cards.slice().reverse().map(cardHTML).join('')}</div>`:`<section class="panel empty">No flashcards yet.<br>Open a topic and generate starter cards, or create your own.<div style="margin-top:14px"><button class="primary" id="addFromEmpty">＋ Create flashcard</button></div></section>`}`}
function cardHTML(c){let t=topicById(c.topicId);return `<article class="mini-card"><div style="display:flex;justify-content:space-between;gap:8px"><span class="pill">${esc(c.subject)}</span><span style="color:#e5a72d">${c.important?'★':''}</span></div><b style="margin-top:12px">${esc(c.question)}</b><p>${esc(c.answer)}</p>${c.reading?`<p>Reading: ${esc(c.reading)}</p>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill">${esc(c.source||'User created')}</span>${cardDue(c)?'<span class="pill" style="background:#fff1e3;color:#a86419">Due</span>':''}</div><div class="mini-actions"><button class="secondary small" data-review-card="${c.id}">Practice</button><button class="ghost small" data-edit-card="${c.id}">Edit</button><button class="ghost small" data-star-card="${c.id}">${c.important?'Unstar':'★ Star'}</button><button class="danger small" data-delete-card="${c.id}">Delete</button></div></article>`}
function studyPage(){if(!studyCards.length)studyCards=data.cards.slice();if(!studyCards.length)return `${pageTitle('Study flashcards','Practice remembering before revealing the answer.')}<section class="panel empty">No flashcards to study yet.<br><button class="primary" data-go="learn" style="margin-top:12px">Create a topic</button> <button class="secondary" id="studyAdd">Add flashcard</button></section>`;studyIndex=Math.max(0,Math.min(studyIndex,studyCards.length-1));let c=studyCards[studyIndex];return `${pageTitle('Study session',`Card ${studyIndex+1} of ${studyCards.length} · ${esc(c.subject)}`,`<button class="ghost small" data-go="flashcards">← All flashcards</button>`)}<div style="max-width:750px;margin:auto"><div class="progress"><span style="width:${(studyIndex+1)/studyCards.length*100}%"></span></div><section class="studycard"><div class="type">${esc(c.subject)} ${c.important?' · ★ MUST REMEMBER':''}</div><div class="question">${esc(c.question)}</div>${answerShown?`<div class="answer">${c.reading?esc(c.reading)+'\\n':''}${esc(c.answer)}${c.notes?`\\n\\n${esc(c.notes)}`:''}</div>`:`<button class="primary" id="showAnswer">Show answer</button>`}</section><div class="study-controls">${answerShown?`<button class="danger" data-grade="Again">Again</button><button class="ghost" data-grade="Difficult">Difficult</button><button class="secondary" data-grade="Good">Good</button><button class="primary" data-grade="Easy">Easy</button>`:''}</div><div class="study-controls"><button class="ghost" id="prevCard" ${studyIndex===0?'disabled':''}>← Previous</button><button class="ghost" id="shuffleCards">Shuffle</button><button class="ghost" id="nextCard">${studyIndex===studyCards.length-1?'Finish':'Next →'}</button><button class="secondary" id="studyAdd">＋ Add card</button></div><p style="text-align:center;color:var(--muted);font-size:12px">Tip: say or write the answer before you reveal it.</p></div>`}
function startStudy(cards){studyCards=cards.slice();studyIndex=0;answerShown=false;go('study')}
function gradeCard(grade){let c=studyCards[studyIndex],d=grade==='Again'?0:grade==='Difficult'?1:grade==='Good'?3:grade==='Easy'?7:1;c.reviews=(c.reviews||0)+1;c.lastReview=today();c.nextReview=new Date(Date.now()+d*86400000).toISOString().slice(0,10);if(grade==='Again')c.difficulty='Difficult';else if(grade==='Easy')c.difficulty='Easy';save();answerShown=false;if(studyIndex<studyCards.length-1)studyIndex++;else{toast('Study session complete!');go('flashcards');return}render()}
function revisionPage(){let due=data.cards.filter(cardDue);return `${pageTitle('Revision','Review cards when they are due to strengthen long-term memory.',`<button class="primary" id="startDue" ${due.length?'':'disabled'}>Start due revision →</button>`)}<div class="stats">${stat('Due now',due.length,'🔄','Ready to review')}${stat('All cards',data.cards.length,'🗂️','In your library')}${stat('Reviewed cards',data.cards.filter(c=>c.reviews).length,'✓','At least one review')}${stat('Must remember',data.cards.filter(c=>c.important).length,'★','Starred cards')}</div><section class="panel"><h3>Due cards</h3><div class="sub">Choose a card to practice it now.</div><div class="topic-list">${due.length?due.map(c=>`<div class="topic-row"><div class="topic-emoji">↻</div><div class="row-main"><b>${esc(c.question)}</b><small>${esc(c.subject)} · ${esc(c.topicId&&topicById(c.topicId)?topicById(c.topicId).title:'Personal card')}</small></div><button class="secondary small" data-review-card="${c.id}">Review</button></div>`).join(''):'<div class="empty">You are all caught up! Add cards or come back later.</div>'}</div></section>`}
const sampleQuiz=(t)=>[{q:`What is the best first step when learning ${t.title}?`,opts:['Memorize everything without context','Understand the core idea and why it matters','Skip examples','Avoid practice'],a:1,why:'Understanding the core idea makes details easier to connect.'},{q:`Which action helps you check your understanding of ${t.title}?`,opts:['Only reread passively','Never test yourself','Explain it in your own words and solve an example','Ignore mistakes'],a:2,why:'Active recall and examples help reveal gaps in understanding.'},{q:`What should you do when a detail is uncertain?`,opts:['Guess confidently','Verify it using a reliable source','Delete all notes','Memorize the guess'],a:1,why:'Verify technical or factual details instead of treating guesses as facts.'}];
function quizzesPage(){let topics=data.topics;return `${pageTitle('Quizzes','Test your understanding and review the areas you find difficult.')}<section class="panel"><h3>Start a quiz</h3><p class="sub">Choose a topic. These built-in questions test learning strategies; add accurate topic facts to your lesson for more useful practice.</p><div class="form-grid" style="margin-top:16px"><div class="field"><label>Topic</label><select id="quizTopic">${topics.map(t=>`<option value="${t.id}">${esc(t.title)} (${esc(t.subject)})</option>`).join('')}</select></div><div class="field"><label>Question count</label><select id="quizCount"><option value="3">3 questions</option><option value="5">5 questions</option></select></div></div><div class="form-actions"><button class="primary" id="beginQuiz" ${topics.length?'':'disabled'}>Start quiz →</button><button class="secondary" id="addQuizTopic">＋ Create a topic</button></div>${!topics.length?'<div class="empty">Create a topic first to begin a quiz.</div>':''}</section><div class="section-head"><div><h2>Quiz history</h2><p>Your recent results.</p></div></div><section class="panel">${data.quizHistory.length?data.quizHistory.slice().reverse().map(q=>`<div class="topic-row"><div class="topic-emoji">🎯</div><div class="row-main"><b>${esc(q.title)}</b><small>${new Date(q.date).toLocaleDateString()} · ${q.correct}/${q.total} correct</small></div><span class="pill">${q.score}%</span></div>`).join(''):'<div class="empty">Your quiz results will appear here.</div>'}</section>`}
function startQuiz(){let t=topicById(document.getElementById('quizTopic').value);if(!t)return;quizState={topic:t,questions:sampleQuiz(t).slice(0,+document.getElementById('quizCount').value),answers:{},submitted:false};renderQuiz()}
function renderQuiz(){currentPage='quizactive';document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));let qz=quizState;let v=document.getElementById('view');v.innerHTML=`${pageTitle('Quiz time',esc(qz.topic.title),'')}<div class="notice">Choose your answer before checking the result. This starter quiz checks learning habits rather than detailed subject facts.</div>${qz.questions.map((q,i)=>`<section class="quiz-question"><div class="eyebrow">QUESTION ${i+1} OF ${qz.questions.length}</div><h3>${esc(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${qz.answers[i]===j?'selected':''} ${qz.submitted&&j===q.a?'correct':''} ${qz.submitted&&qz.answers[i]===j&&j!==q.a?'wrong':''}" data-quiz-answer="${i}:${j}" ${qz.submitted?'disabled':''}>${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join('')}${qz.submitted?`<div class="feedback">${qz.answers[i]===q.a?'✓ Correct.':'✦ Correct answer: '+esc(q.opts[q.a])+'.'} ${esc(q.why)}</div>`:''}</section>`).join('')}<div class="form-actions">${qz.submitted?'<button class="primary" id="quizDone">Back to quizzes</button>':'<button class="primary" id="submitQuiz">Check answers →</button><button class="ghost" data-go="quizzes">Cancel</button>'}</div>`;attachPageEvents()}
function submitQuiz(){let qz=quizState;if(qz.submitted)return;let correct=qz.questions.reduce((n,q,i)=>n+(qz.answers[i]===q.a?1:0),0);qz.submitted=true;let score=Math.round(correct/qz.questions.length*100);data.quizHistory.push({id:uid(),title:qz.topic.title,correct,total:qz.questions.length,score,date:new Date().toISOString()});save();renderQuiz();toast(`Quiz completed: ${score}%`)}
function libraryPage(){return `${pageTitle('My library','Search, manage, and back up your personal learning material.',`<button class="primary" id="libAdd">＋ Add flashcard</button> <button class="secondary" id="exportData">Export backup</button> <button class="ghost" id="importBtn">Import backup</button>`)}<div class="library-tools"><input id="libSearch" placeholder="Search your cards..." style="flex:1;min-width:180px"><select id="libFilter"><option value="all">All cards</option><option value="important">Must remember</option><option value="due">Due for review</option><option value="user">User-created</option></select><select id="libSubject"><option value="all">All subjects</option>${Object.keys(icons).map(s=>`<option>${s}</option>`).join('')}</select></div><div id="libraryResults" class="cards-grid">${data.cards.slice().reverse().map(cardHTML).join('')||'<section class="panel empty">Your library is empty. Create your first flashcard!</section>'}</div><section class="panel" style="margin-top:20px"><h3>Your topics</h3><div class="topic-list">${data.topics.map(t=>`<div class="topic-row"><div class="topic-emoji">${topicEmoji(t.subject)}</div><div class="row-main"><b>${esc(t.title)}</b><small>${esc(t.subject)} · ${data.cards.filter(c=>c.topicId===t.id).length} cards</small></div><button class="secondary small" data-open-topic="${t.id}">Open</button><button class="danger small" data-delete-topic="${t.id}">Delete topic</button></div>`).join('')||'<div class="empty">No topics saved.</div>'}</div></section>`}
function filterLibrary(){let q=(document.getElementById('libSearch')?.value||'').toLowerCase(),f=document.getElementById('libFilter')?.value||'all',s=document.getElementById('libSubject')?.value||'all';let cards=data.cards.filter(c=>(!q||(c.question+' '+c.answer+' '+c.notes).toLowerCase().includes(q))&&(s==='all'||c.subject===s)&&(f==='all'||f==='important'&&c.important||f==='due'&&cardDue(c)||f==='user'&&c.source==='User created'));document.getElementById('libraryResults').innerHTML=cards.slice().reverse().map(cardHTML).join('')||'<section class="panel empty">No cards match your filters.</section>';attachCardActions()}
function editCard(id){let c=data.cards.find(x=>x.id===id);if(!c)return;openCardModal(c.topicId||'');let form=document.getElementById('cardForm');document.querySelector('#modalBackdrop h2').textContent='Edit flashcard';document.getElementById('cSubject').value=c.subject;document.getElementById('cTopic').value=c.topicId||'';document.getElementById('cQuestion').value=c.question;document.getElementById('cAnswer').value=c.answer;document.getElementById('cReading').value=c.reading||'';document.getElementById('cDifficulty').value=c.difficulty||'Normal';document.getElementById('cNotes').value=c.notes||'';document.getElementById('cImportant').checked=!!c.important;form.onsubmit=e=>{e.preventDefault();Object.assign(c,{subject:document.getElementById('cSubject').value,topicId:document.getElementById('cTopic').value,question:document.getElementById('cQuestion').value.trim(),answer:document.getElementById('cAnswer').value.trim(),reading:document.getElementById('cReading').value.trim(),difficulty:document.getElementById('cDifficulty').value,notes:document.getElementById('cNotes').value.trim(),important:document.getElementById('cImportant').checked});save();closeModal();render();toast('Flashcard updated')}}
function deleteCard(id){if(!confirm('Delete this flashcard? This cannot be undone unless you exported a backup.'))return;data.cards=data.cards.filter(c=>c.id!==id);save();render();toast('Flashcard deleted')}
function attachCardActions(){document.querySelectorAll('[data-review-card]').forEach(b=>b.onclick=()=>startStudy(data.cards.filter(c=>c.id===b.dataset.reviewCard)));document.querySelectorAll('[data-edit-card]').forEach(b=>b.onclick=()=>editCard(b.dataset.editCard));document.querySelectorAll('[data-delete-card]').forEach(b=>b.onclick=()=>deleteCard(b.dataset.deleteCard));document.querySelectorAll('[data-star-card]').forEach(b=>b.onclick=()=>{let c=data.cards.find(x=>x.id===b.dataset.starCard);if(c){c.important=!c.important;save();render();}})}
function attachPageEvents(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{go('learn');document.getElementById('subject').value=b.dataset.subject});
document.querySelectorAll('[data-open-topic]').forEach(b=>b.onclick=()=>{currentTopicId=b.dataset.openTopic;go('topic')});
let tf=document.getElementById('topicForm');if(tf)tf.onsubmit=createTopic;
document.getElementById('addFromPage')?.addEventListener('click',()=>openCardModal());
document.getElementById('addFromEmpty')?.addEventListener('click',()=>openCardModal());
document.getElementById('quickAdd')?.addEventListener('click',()=>openCardModal());
document.querySelectorAll('[data-add-card]').forEach(b=>b.onclick=()=>openCardModal(b.dataset.addCard));
document.querySelectorAll('[data-point-card]').forEach(b=>b.onclick=()=>{let p=b.dataset.pointCard;openCardModal(b.dataset.tid);setTimeout(()=>{document.getElementById('cQuestion').value='Key point';document.getElementById('cAnswer').value=p},0)});
document.querySelectorAll('[data-generate]').forEach(b=>b.onclick=()=>genCards(b.dataset.generate));
document.querySelectorAll('[data-study-topic]').forEach(b=>b.onclick=()=>startStudy(data.cards.filter(c=>c.topicId===b.dataset.studyTopic)));
document.querySelectorAll('[data-simple]').forEach(b=>b.onclick=()=>{let t=topicById(b.dataset.simple);if(t){t.lesson.intro='In simple words: '+t.title+' is something you can understand by learning the basic idea first, looking at one clear example, and then practising it yourself.';save();render();toast('Simpler explanation shown')}})
document.getElementById('showAnswer')?.addEventListener('click',()=>{answerShown=true;render()});
document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>gradeCard(b.dataset.grade));
document.getElementById('prevCard')?.addEventListener('click',()=>{studyIndex=Math.max(0,studyIndex-1);answerShown=false;render()});
document.getElementById('nextCard')?.addEventListener('click',()=>{if(studyIndex<studyCards.length-1){studyIndex++;answerShown=false;render()}else{toast('Session complete!');go('flashcards')}});
document.getElementById('shuffleCards')?.addEventListener('click',()=>{studyCards.sort(()=>Math.random()-.5);studyIndex=0;answerShown=false;render()});
document.getElementById('studyAdd')?.addEventListener('click',()=>openCardModal());
document.getElementById('startDue')?.addEventListener('click',()=>startStudy(data.cards.filter(cardDue)));
document.getElementById('beginQuiz')?.addEventListener('click',startQuiz);
document.getElementById('addQuizTopic')?.addEventListener('click',()=>go('learn'));
document.querySelectorAll('[data-quiz-answer]').forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.quizAnswer.split(':').map(Number);quizState.answers[i]=j;renderQuiz()});
document.getElementById('submitQuiz')?.addEventListener('click',()=>{if(Object.keys(quizState.answers).length<quizState.questions.length){toast('Please answer every question first.');return}submitQuiz()});
document.getElementById('quizDone')?.addEventListener('click',()=>go('quizzes'));
document.getElementById('libAdd')?.addEventListener('click',()=>openCardModal());
document.getElementById('exportData')?.addEventListener('click',exportData);
document.getElementById('importBtn')?.addEventListener('click',()=>document.getElementById('importFile').click());
document.querySelectorAll('[data-delete-topic]').forEach(b=>b.onclick=()=>{let t=topicById(b.dataset.deleteTopic);if(confirm(`Delete topic "${t.title}"? Your flashcards will be preserved.`)){data.topics=data.topics.filter(x=>x.id!==t.id);data.cards.forEach(c=>{if(c.topicId===t.id)c.topicId=''});save();render();toast('Topic deleted; cards were preserved.')}});
['libSearch','libFilter','libSubject'].forEach(id=>document.getElementById(id)?.addEventListener('input',filterLibrary));
attachCardActions();
}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nekomemo-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')}
function importDataFile(file){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.topics)||!Array.isArray(d.cards))throw Error('invalid');if(confirm('Import backup? This replaces the current browser data. Export first if you want a backup.')){data={...defaultData,...d};save();render();toast('Backup imported')}}catch(e){toast('That backup file could not be read.')}};r.readAsText(file)}
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){go('library');let input=document.getElementById('libSearch');if(input){input.value=e.target.value;filterLibrary()}}});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.body.insertAdjacentHTML('beforeend','<input id="importFile" type="file" accept=".json,application/json" hidden>');
document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importDataFile(e.target.files[0]);e.target.value=''});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
